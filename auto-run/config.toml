# auto-run/config.toml — knobs for the overnight story orchestrator.
# Read by orchestrate.py via stdlib tomllib. Edit values, not code.

[run]
# Hard caps so a run is always bounded.
max_stories       = 0      # stop after N completed stories this run; 0 = no cap (until none left)
max_runtime_hours = 0      # 0 = no time cap (run until done / failure / STOP). Rate-limit
                           # sleeps are exempt regardless (they pause mid-phase, not at a boundary).
stop_on_dirty_tree = false # false = WARN and continue on a dirty tree (lists the uncommitted
                           # files; lets you resume an interrupted story). true = refuse to start.
                           # NOTE when false: leftover work from a prior halt rolls into the next
                           # story's commit — the warning surfaces it; clean the tree if unwanted.
once              = false  # do exactly one story then stop (good for the first supervised run)

[claude]
model         = "claude-opus-4-8"   # explicit: the `opus` alias resolves to 4.5 on this CLI, not 4.8
fallback_model = ""        # e.g. "sonnet" to survive overnight Opus rate limits; "" = none
permission_mode = ""       # EMPTY = default mode + a vetted --allowedTools allowlist
                           # (specific grant, not a blank check). Set "bypassPermissions"
                           # only to deliberately revert to allow-everything.
max_turns     = 250        # safety bound per phase; a phase that hits this is treated as FAILURE
phase_timeout_sec = 5400   # 90 min HARD cap per claude phase; a run past this is killed -> FAILURE
stall_timeout_sec = 600    # abort a phase after this many seconds with NO stream output (0 = off);
                           # catches a hang far sooner than phase_timeout_sec (see FINDINGS-01).
heartbeat_sec     = 30     # during silence (a long tool run), print a "… still working" line this often
extra_args    = []         # any extra claude flags (--output-format/--verbose are set automatically)

[ci]
fix_attempts = 2           # if CI is red, run an LLM "fix" phase then re-check, up to N times
max_output_chars = 40000   # how much CI output (from the END, where failures are) to hand each
                           # fresh fix agent — feed the COMPLETE real failure, not a stub

[rate_limit]
# Survive Claude usage/rate-limit windows overnight: when a phase's output shows a
# limit message, sleep until it resets (parsed from the message), then RE-RUN the
# phase — no run-ending halt. Auth REVOCATIONS still halt (they need you). The sleep
# is exempt from any runtime budget and a Ctrl-C aborts it.
enabled          = true
max_retries      = 3       # per phase: how many times it may sleep-and-resume
max_wait_sec     = 21600   # 6h cap on a single sleep (safety bound)
default_wait_sec = 2700    # 45 min: fail-safe wait when the reset time can't be parsed
beep_on_sleep    = true    # ONE short beep on entering a wait (distinct from the failure alarm)
# Case-insensitive substrings meaning "rate window — sleep & resume" (retryable).
# Broad on purpose (no confirmed message format); matched against the result
# envelope + stderr, not the agent's tool output, to avoid false positives.
retry_patterns = [
  "you've hit your limit", "usage limit", "rate limit", "rate_limit",
  "limit will reset", "limit reached", "resets at", "approaching your usage",
]
# Substrings meaning "revoked / auth failure — HALT for a human" (not retryable).
halt_patterns = [
  "does not have access to claude", "please login again", "invalid api key",
]

[log]
# Max chars shown per item in the live terminal play-by-play. Raise to see more.
tool_arg_chars = 200       # the argument gist on a tool-call line   (-> Edit: <path/cmd…>)
text_chars     = 2000      # the model's narration / text blocks
result_chars   = 400       # the tool-result snippet                 (<- result (ok) …)

[docker]
# Bring the dev container up automatically at the START of each run so the CI
# gate runs INSIDE it (dependency parity with the shipped image) — no manual
# `docker compose up -d` needed. The image bakes ruff/mypy/pytest + native OCR
# deps, so in-container checks really run (no false-green skip). Failure is
# non-fatal: ci.sh degrades to host-side with a warning.
enabled        = false       # HOST-SIDE for now: the container COPYs source at build time (no
                             # bind-mount), so in-container CI would test frozen code. Epic-3 is
                             # pure-Python (no OCR) — host CI is complete + fast. Flip to true after
                             # compose.yaml gets dev bind-mounts (planned for the OCR epics).
service        = "web"       # compose service name (matches compose.yaml)
compose_file   = "compose.yaml"
build          = false       # true = `--build` every run; false = build only if the image is missing
up_timeout_sec = 3600        # the FIRST build (OCR deps + HuggingFace weight warmup) is slow on a
                             # poor connection — give it an hour so it can't get guillotined mid-build.
                             # Once the image exists, `up -d` is seconds, so this ceiling never bites again.

[alert]
# Audible alarm when the run EXITS overnight, so you wake to fix a stop/failure
# instead of losing hours. winsound.Beep on Windows (real tones via the default
# audio device); falls back to the terminal bell elsewhere. Fires on halt, crash,
# and the dirty-tree / lock refusals; also on a clean finish when on_success=true.
enabled    = true
beeps      = 5       # 3–5 ≈ alarm-like
on_success = true    # also beep when the run finishes cleanly (so you know it's done)

[worktree]
# Run the orchestrator inside a dedicated git worktree on its own branch —
# its OWN index/HEAD, sharing the same .git object store as the main checkout.
# This removes the single-shared-tree constraint: a human can edit auto-run/ (or
# anything) on main while a run is live, and the run can even START with
# uncommitted work on main, because it branches off `base_ref` (a PUSHED ref),
# NOT the working tree. One worktree + one branch per run; per-story commits all
# land on that branch and are pushed for human review (no auto-merge).
enabled            = false                  # false = legacy single-tree mode (no regression)
base_ref           = "origin/main"          # branch the run off this PUSHED ref (fetched first)
branch_prefix      = "auto/run"             # branch name = "<branch_prefix>-<run_id>"
path_template      = "../ttb-autorun-{run_id}"  # worktree dir, relative to the canonical repo root
cleanup_on_success = true                   # `git worktree remove` after a fully green run; LEFT on halt

[git]
commit = true
push   = true
remote = "origin"          # pushes the CURRENT branch (main) to this remote
# Paths a STORY commit must never include. Walls the harness off from story
# commits so you can edit auto-run/ in parallel without it being swept in.
exclude_paths = ["auto-run"]

[paths]
# All relative to the repo root (the parent of auto-run/). Override repo_root if needed.
repo_root     = ".."
sprint_status = "_bmad-output/implementation-artifacts/sprint-status.yaml"
ci_script     = "scripts/ci.sh"
# Extra dirs the headless claude is allowed to touch (memory + scratch).
add_dirs = [
  "c:/tmp",
  "C:/Users/Diane/.claude/projects/c--alcorn-Treasury-TTB-label-POC/memory",
]
