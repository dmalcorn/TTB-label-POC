# Railway config-as-code for the TTB-label-POC project, `ttb-web` service.
# Story 1.6 · architecture D1/D7. Build/deploy settings here override the
# dashboard. See docs/railway-deployment.md for the live project identity.

[build]
# Dockerfile, NOT Nixpacks — the image bakes native OCR deps (tesseract-ocr,
# libgl1, libglib2.0-0); Nixpacks would not reproduce them (D1).
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Honor Railway's injected $PORT. Railway runs startCommand in EXEC form (no
# shell), so a bare `--port $PORT` reaches uvicorn literally and crashes
# ("'$PORT' is not a valid integer" — observed on the first 1.6 deploy). Wrapping
# in `sh -c` forces shell expansion; `${PORT:-8000}` falls back to 8000 off
# Railway. The service var PORT=8000 pins it to the domain's targetPort (8000) so
# the edge and the listener agree (the $PORT-mismatch 404 trap). The Dockerfile
# CMD keeps 8000 for local/compose.
#
# `--proxy-headers --forwarded-allow-ips=*`: Railway terminates TLS at its edge
# and forwards plain HTTP from a non-loopback internal IP. Without trusting the
# forwarded headers, uvicorn's default `forwarded_allow_ips=127.0.0.1` ignores
# `X-Forwarded-Proto: https`, so `request.url.scheme` stays "http" and the Story
# 1.5 access cookie ships WITHOUT `Secure` in production. Trusting the proxy
# makes the scheme reflect the real https hop so the cookie is `Secure` on
# Railway. (Local/compose has no proxy → scheme is genuinely http → no `Secure`,
# which is correct.) Closes the deferred-work.md item assigned to Story 1.6.
startCommand = "sh -c 'uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000} --proxy-headers --forwarded-allow-ips=*'"
# Pure in-memory liveness route (no DB, no network), exempt from the Story 1.5
# token gate (AC-3) — Railway's probe gets 200 without a token.
healthcheckPath = "/healthz"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# ── Volume — NOT expressible in railway.toml (Railway limitation) ─────────────
# Railway volumes are created via dashboard/CLI only, never config-as-code, so
# the mount cannot live in this file. The SQLite DB + generated images (D7)
# persist on a Volume mounted at /data, with the service variable
#   DATABASE_PATH=/data/app.db
# so data survives redeploys (Railway's container FS is ephemeral). The Volume DB
# starts empty and is filled by the seed-if-empty startup guard (app/main.py).
# Provision once with:
#   railway volume add --mount-path /data --service ttb-web
# Full details + the other service env vars are in docs/railway-deployment.md.
