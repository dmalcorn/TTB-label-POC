[project]
name = "ttb-label-poc"
version = "0.1.0"
description = "TTB COLA Label Specialist Workspace (POC)"
requires-python = ">=3.13"

[tool.ruff]
line-length = 100
target-version = "py313"
# The auto-run/ orchestrator harness is tooling, walled off from story commits;
# don't gate story CI (`ruff check .`) on its lint debt.
extend-exclude = ["auto-run"]

[tool.ruff.lint]
# Sensible default rule set: pyflakes (F), pycodestyle (E/W), isort (I),
# pyupgrade (UP), flake8-bugbear (B).
select = ["E", "W", "F", "I", "UP", "B"]

[tool.mypy]
# CI Phase 3 type-check (scripts/ci.sh). Pinned to the container/runtime target
# (python:3.13-slim) so host runs match. `--ignore-missing-imports` is passed by
# the CI invocation for the native OCR/LLM deps that ship no type stubs.
python_version = "3.13"
# auto-run/ is the overnight orchestrator harness — walled off from story work and
# already excluded from ruff. Exclude it from mypy too, so a harness type quirk
# can never halt a story's CI gate (`mypy .` runs under `set -e`). targetsetup/ is
# gitignored local reference material (the "heavyweight factory variant", not this
# POC); ruff skips it via .gitignore but `mypy .` does not, so exclude it here too —
# its type debt must never gate the POC's CI.
exclude = ['^auto-run/', '^targetsetup/']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
